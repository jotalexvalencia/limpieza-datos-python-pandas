name: Deploy to S3  # Nombre del flujo de trabajo

on:
  push:  # El flujo se activa cada vez que haces un push a la rama configurada (predeterminada: 'dev-python')
    branches:
      - dev-python  # Especifica la rama en la que trabajas (puedes cambiarla si es necesario)

jobs:
  deploy:
    runs-on: ubuntu-latest  # Se ejecuta en un contenedor Ubuntu proporcionado por GitHub Actions

    steps:
      - name: Checkout code  # Descarga el código del repositorio en el contenedor
        uses: actions/checkout@v3

      - name: Configure AWS Credentials  # Configura las credenciales para AWS
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}  # Acceso a la clave configurada como secreto en tu repositorio
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}  # Clave secreta configurada en tu repositorio
          aws-region: us-east-1  # Configura la región de tu bucket en AWS

      - name: Verificar la existencia del archivo  # Paso opcional para validar la presencia del archivo antes de subirlo
        run: |
          if [ ! -f ventas_limpias.csv ]; then
            echo "ERROR: El archivo ventas_limpias.csv no existe. Por favor, verifica antes de intentar subirlo." 
            exit 1  # Finaliza el flujo si no encuentra el archivo
          fi

      - name: Upload to S3  # Comando para cargar el archivo a tu bucket de S3
        run: aws s3 cp ventas_limpias.csv s3://limpieza-datos-alex/  # Reemplaza el archivo existente en S3 si ya está

      - name: Listar archivos en S3 (opcional)  # Verifica que el archivo fue subido correctamente
        run: aws s3 ls s3://limpieza-datos-alex/  # Lista los archivos en el bucket para confirmar el despliegue
