# ================================================
# 🌐 Flujo GitHub Actions: Despliegue a S3 (AWS)
# Archivo: deploy-to-s3.yml
# Autor: jorgealexandervalencia@gmail.com
# Rama de activación: dev-python
# Objetivo: Automatizar limpieza de datos y carga del archivo 'ventas_limpias.csv' al bucket S3
# ================================================

name: Deploy to S3  # Nombre del flujo de trabajo

on:
  push:  # El flujo se activa cada vez que se hace un push a la rama configurada
    branches:
      - dev-python  # Cambiar si trabajás en otra rama

jobs:
  deploy:
    runs-on: ubuntu-latest  # El flujo se ejecuta en una VM Linux provista por GitHub

    steps:
      - name: 🧾 Checkout del código
        uses: actions/checkout@v3  # Descarga el contenido del repositorio al entorno

      - name: 🔐 Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}  # Definida en Settings > Secrets
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}  # Debe estar encriptada como secreto
          aws-region: us-east-1  # Región del bucket S3 donde se cargan los archivos

      - name: 🧼 Ejecutar limpieza de datos con process_data.py
        run: python scripts/process_data.py  # ACTUALIZADO: archivo movido a carpeta 'scripts'

      - name: 🔍 Verificar existencia del archivo limpio
        run: |
          if [ ! -f ventas_limpias.csv ]; then
            echo "ERROR: El archivo ventas_limpias.csv no fue generado."
            exit 1
          fi

      - name: ☁️ Subir archivo a Amazon S3
        run: aws s3 cp ventas_limpias.csv s3://limpieza-datos-alex/  # Reemplaza el archivo si ya existe

      - name: 📋 Listar archivos en el bucket (verificación opcional)
        run: aws s3 ls s3://limpieza-datos-alex/  # Permite comprobar que el archivo fue subido correctamente
